[project]
name = "triptogether"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
triptogether = "triptogether:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
